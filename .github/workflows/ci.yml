name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno:
    name: Deno — typecheck, tests, JSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Pinned deliberately. `v2.x` floats, so a Deno release can turn CI red
          # with no change from us - which is exactly what happened on the first
          # run: local 2.3.7 passed, CI resolved 2.9.6 and surfaced a real
          # cross-runtime typing error. Bump this on purpose, not by accident.
          deno-version: v2.9.6

      # `deno task check` resolves @types/node from package.json devDependencies,
      # so it fails with 'Could not find "@types/node"' unless deps are installed
      # first. This is the whole reason for the step - do not drop it.
      - name: Install dependencies
        run: deno install

      - name: Type check
        run: deno task check

      - name: Test (core, error handling, spawning, settlement, docs)
        run: deno task test

      # Publishability gate. Catches config regressions - a missing name field,
      # a query-suffixed specifier in the module graph, newly introduced slow
      # types - before they reach a release tag.
      - name: JSR publish dry run
        run: deno publish --dry-run --allow-dirty

      # Stronger than the dry run: stages only the files that would actually be
      # published and runs a real threaded worker against them. core/workerWrapper.ts
      # is reached via new URL(), not an import, so it is absent from the module
      # graph - the dry run would pass with it missing and every consumer would
      # fail on their first threaded task. This is the check that catches that.
      - name: JSR smoke test
        run: deno task jsr:smoke

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node so `cache: pnpm` can find the store.
      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Installation also runs the prepare script, so this exercises the
      # esbuild + tsc library build as well as resolving dependencies.
      - name: Install and build
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  browser:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps

      # Serves the built files on :3000 via the webServer block in
      # playwright.config.ts; runs chromium, firefox and webkit.
      - name: Test
        run: pnpm run test:browser

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  quality:
    name: Lint (gating) & format (advisory)
    runs-on: ubuntu-latest
    # Lint gates: the tree is clean as of 2026-08-29, so a new problem fails CI.
    # Format does not: `deno fmt --check` still reports 65 of 68 files
    # unformatted, so making it blocking would fail every run. Reformatting is a
    # large mechanical diff that has to originate in the private repo; once it
    # lands, delete the continue-on-error below and this gates too.
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Pinned deliberately. `v2.x` floats, so a Deno release can turn CI red
          # with no change from us - which is exactly what happened on the first
          # run: local 2.3.7 passed, CI resolved 2.9.6 and surfaced a real
          # cross-runtime typing error. Bump this on purpose, not by accident.
          deno-version: v2.9.6

      - name: Format
        continue-on-error: true
        run: deno fmt --check

      - name: Lint
        run: deno lint .
