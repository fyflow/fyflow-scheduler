name: Publish

# Tag-triggered publish to JSR.
#
# Requires, one time, on jsr.io: the @fyflow scope to exist, the
# @fyflow/scheduler package to be created in it, and that package linked to the
# fyflow/fyflow-scheduler GitHub repository. The link is what makes the OIDC
# token below sufficient - no token or secret is stored here.
#
# npm is NOT published from here. The npm package ships the esbuild bundles and
# needs an NPM_TOKEN; adding it is a separate decision.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for JSR's OIDC publish

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Keep in step with ci.yml. See the note there on why this is pinned.
          deno-version: v2.9.6

      - name: Install dependencies
        run: deno install

      # A JSR version is immutable once published - it cannot be replaced or
      # unpublished. Everything below therefore runs before `deno publish`,
      # rather than trusting that CI was green on this SHA.

      - name: Check versions agree
        run: |
          DENO_VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
          NPM_VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('package.json')).version)")

          echo "deno.json:    $DENO_VERSION"
          echo "package.json: $NPM_VERSION"

          if [ "$DENO_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::deno.json ($DENO_VERSION) and package.json ($NPM_VERSION) disagree. They are published as two separately-named packages and must stay in step."
            exit 1
          fi

          # Only enforce the tag on a tag push; workflow_dispatch has no tag.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag:          $TAG_VERSION"
            if [ "$TAG_VERSION" != "$DENO_VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match deno.json version $DENO_VERSION. Bump the manifests or retag."
              exit 1
            fi
          fi

      - name: Type check
        run: deno task check

      - name: Lint
        run: deno lint .

      - name: Test
        run: deno task test

      - name: Test scripts
        run: deno task test:scripts

      # Runs a real threaded worker against only the files that would ship, and
      # asserts the package has no dependencies and no Node-specific files.
      # This is the check that catches core/workerWrapper.ts going missing -
      # it is absent from the module graph, so `publish` alone cannot see it.
      - name: JSR smoke test
        run: deno task jsr:smoke

      # `deno install` above rewrites deno.lock: the committed lockfile pins only
      # the JSR imports, so resolving package.json's npm devDependencies appends
      # ~477 lines. `deno publish` then aborts on the dirty tree. deno.lock is not
      # in the publish allowlist, so it cannot affect the published artifact.
      #
      # Restoring just this one path - rather than passing --allow-dirty - keeps
      # the dirty-tree check meaningful: anything ELSE unexpectedly modified
      # still aborts the publish.
      #
      # Remove this once the committed lockfile includes the npm entries, at
      # which point `deno install` is a no-op here.
      - name: Restore lockfile
        run: git checkout -- deno.lock

      - name: Publish
        run: deno publish

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Runs only if JSR succeeded, so the two registries cannot drift apart on a
    # release: the version guard and the full gate set have already passed.
    needs: publish
    permissions:
      contents: read
      id-token: write   # trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 24 deliberately: npm trusted publishing needs npm >= 11.5.1, and
      # Node 22 still ships npm 10.9.2. registry-url is what wires npm up for
      # the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # Also runs prepare, which is the esbuild + tsc library build, so the
      # tarball is built from this checkout rather than anything cached.
      - name: Install and build
        run: pnpm install --frozen-lockfile

      # npm, unlike JSR, hard-errors when republishing an existing version
      # (E403) rather than skipping. Re-running this workflow on an unchanged
      # version would therefore fail on an otherwise correct release.
      - name: Skip if this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm - nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is not published yet."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the tarball before publishing
        if: steps.check.outputs.publish == 'true'
        run: npm pack --dry-run

      # No NPM_TOKEN. This relies on a trusted publisher being configured for
      # fyflow-scheduler on npmjs.com, pointing at this repository and this
      # workflow file (.github/workflows/publish.yml). Renaming this file breaks
      # the trust relationship and publishing starts failing auth.
      # Provenance is attested automatically via the OIDC token.
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
